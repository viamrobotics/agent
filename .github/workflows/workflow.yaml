name: Test and Build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
  release:
    types: [created]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    env:
      MISE_GO_SET_GOROOT: false
    # Skip rerun on unrelated label changes; still run when dev-release is
    # added so the build job has a fresh test pass before uploading artifacts.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'dev-release')
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to be able to generate prerelease tags
    - name: Install toolchain
      uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Lint
      run: |
        make lint
        GEN_DIFF=$(git status -s)
        if [ -n "$GEN_DIFF" ]; then
            echo '"make lint" resulted in the following untracked changes:' 1>&2
            git diff
            echo '"make lint" resulted in changes not in git' 1>&2
            git status
            exit 1
        fi
    - name: Shell script formatting
      run: shfmt -d *.sh
    - name: Test
      run: make test
    - name: Build
      run: make all

  test-macos:
    name: Test on MacOS
    runs-on: macos-latest
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'dev-release')
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to be able to generate prerelease tags
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Test
      run: make test

  test-windows:
    name: Test on Windows
    runs-on: windows-2022
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'dev-release')
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to be able to generate prerelease tags
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Test
      shell: bash
      # Not `make test`: that target passes -race, which needs cgo, which needs
      # a C toolchain we don't otherwise depend on for Windows builds.
      run: |
        # Every package is tested on Windows; the exclusions below are per-test
        # rather than per-package so that a package with one broken test still
        # contributes the rest of its coverage. Each entry is a `go test -skip`
        # pattern: `/`-separated elements match successive subtest names, and
        # the whole list is joined with `|` into one alternation.
        #
        # These are known failures on Windows, not flakes. Nothing here has been
        # investigated yet — the list exists so Windows can start gating PRs at
        # all. Deleting entries as the underlying problems get fixed is the point;
        # nothing should be added without a reason recorded alongside it.
        WINDOWS_SKIP=(
          # `GetFileAttributesEx ...\cache\source-binary-0.70.0: The system
          # cannot find the file specified`. The later subtests reuse the state
          # the failing ones set up, so the whole test goes rather than the
          # three failing leaves.
          '^TestUpdateBinary$'
          # ForceSymlink: `is a directory` / `The system cannot find the file
          # specified`.
          '^TestForceSymlink$'
          '^TestInstall$/^(fresh_install|self_update)$'
          # Renaming the decompressed file out of tmp/: `The process cannot
          # access the file because it is being used by another process`.
          '^TestDecompressFile$'
          # Compares a fixture that sets viam_server_start_timeout_minutes: 10
          # against DefaultConfig(), which is 10 on Linux but 1 on Windows.
          '^TestConvertJson$'
          # Writes into a fallback service dir: `The system cannot find the path
          # specified`. The default-dir subtests pass.
          '^TestSystemdManagerInstallService$/^(new_install_in_default_directory|new_install_in_fallback_directory|identical_install_in_fallback_directory|outdated_install_in_fallback_directory)$'
          # Expect an error that Windows does not produce, or leave a handle open
          # that blocks t.TempDir cleanup.
          '^TestDownloadFile$/^(does_not_overwrite_existing_files|handles_multiple_duplicates|handles_files_with_special_characters_in_name)$'
          '^TestInitPaths$/^(failure_cannot_create_directory|failure_not_directory)$'
          # utils.BuildViamAgent shells out to `make test-build` with
          # TESTBUILD_OUTPUT_PATH set to a backslashed Windows temp path; the
          # backslashes are eaten before `go build -o` sees them, so the binary
          # lands in the repo root under a mangled name and the path the helper
          # returns does not exist. Only the valid_file subtest asserts on that
          # path, but the call sits in the table literal rather than inside the
          # subtest, so skipping the leaf alone would still build the agent —
          # and would fail the parent outright on a runner without make.
          # Skipping the parent also keeps the mangled file out of the checkout.
          # TestUpdateBinary above is the helper's only other caller.
          '^TestIsValidAgentBinary$'
          # `listen tcp 127.0.0.1:8080: bind: An attempt was made to access a
          # socket in a way forbidden by its access permissions` — 8080 falls in
          # a Windows excluded port range.
          '^TestFetchRestartStatus$'
        )
        SKIP=$(IFS='|'; echo "${WINDOWS_SKIP[*]}")
        go test -count=1 -skip "$SKIP" ./...

  build:
    name: Build and Upload
    runs-on: ubuntu-latest
    # Upload artifacts on: main pushes, releases, and PRs labeled `dev-release`
    # (internal PRs only — fork PRs are blocked to keep secrets out of reach).
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'release' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'dev-release') ||
          (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'dev-release'))
        )
      )
    needs: test
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      pr_urls: ${{ steps.pr_urls.outputs.urls }}
      version: ${{ steps.version.outputs.value }}
    env:
      # Empty on non-PR events; dev-version.sh consumes these to stamp PR
      # builds as v<next>-pr.<pr-num>.<head-sha>. PR_HEAD_SHA is the branch
      # HEAD (not the synthetic merge-commit SHA GitHub checks out for
      # pull_request events).
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to be able to generate prerelease tags
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Compute version
      id: version
      run: echo "value=$(./dev-version.sh)" >> "$GITHUB_OUTPUT"
    - name: Build
      run: make all
    - name: Sign Windows binaries
      uses: ./.github/actions/sign-windows
      with:
        files: 'bin/viam-agent-*-windows-x86_64'
    - name: Generate manifest
      run: make manifest
    - uses: actions/upload-artifact@v4
      with:
        name: viam-agent-windows
        path: bin/viam-agent-*-windows-x86_64
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
    - uses: google-github-actions/setup-gcloud@v2
    - name: Upload binaries to GCS (Release)
      id: upload_release
      if: github.event_name == 'release'
      run: |
        gsutil -h "Cache-Control:no-cache" cp bin/viam-agent-* install.sh uninstall.sh preinstall.sh gs://packages.viam.com/apps/viam-agent/
        gsutil -h "Cache-Control:no-cache" cp etc/viam-agent-*.json gs://packages.viam.com/apps/viam-subsystems/
    # Skipped when HEAD is a release tag. dev-version.sh short-circuits on a direct
    # tag, so a main push sitting on the tagged commit computes the bare version
    # (v1.0.1, no -dev suffix) and produces the same filenames and the same manifest
    # `upload-path` as the release-event run. Both runs then race to write the same
    # apps/viam-subsystems/ manifest, and if this one wins, the published manifest
    # advertises the sha of the prerelease binary while apps/viam-agent/ holds the
    # release binary. Windows only, since Authenticode timestamps make that the one
    # artifact whose bytes differ between two builds of the same commit. The release
    # run already publishes these artifacts, so there is nothing to add here.
    - name: Upload binaries to GCS (Prerelease)
      id: upload_prerelease
      if: github.event_name != 'release' && github.event_name != 'pull_request' && contains(steps.version.outputs.value, '-dev.')
      run: |
        gsutil -h "Cache-Control:no-cache" cp bin/viam-agent-* gs://packages.viam.com/apps/viam-agent/prerelease/
        gsutil -h "Cache-Control:no-cache" cp etc/viam-agent-*.json gs://packages.viam.com/apps/viam-subsystems/
    # Every manifest this run wrote has to advertise the sha256 of the object its
    # upload-path names. Because this runs after the upload, any run that writes
    # a manifest also re-reads it afterwards, so the last writer in a race always
    # inspects the state it left behind. That is what makes detection independent
    # of which run wins and of how far apart they land.
    #
    # Gated on the upload steps' outcome rather than on a copy of their `if`
    # conditions, deliberately. Restating `contains(version, '-dev.')` here would
    # tie this check to the same predicate that guards the prerelease upload, so
    # a regression in that guard would skip the check in exactly the run that
    # just clobbered a manifest. Keying off what actually ran instead means a run
    # that publishes always verifies, however it came to publish.
    - name: Verify manifests published by this run
      if: steps.upload_release.outcome == 'success' || steps.upload_prerelease.outcome == 'success'
      run: ./verify-manifests.sh --version "${{ steps.version.outputs.value }}"
    - name: Upload binaries to GCS (PR dev release)
      if: github.event_name == 'pull_request'
      run: |
        PR_PATH="gs://packages.viam.com/apps/viam-agent/prerelease/pr-${{ github.event.pull_request.number }}"
        gsutil -h "Cache-Control:no-cache" cp bin/viam-agent-* "$PR_PATH/"
        gsutil -h "Cache-Control:no-cache" cp etc/viam-agent-*.json "$PR_PATH/"
    - name: Collect PR dev release URLs
      id: pr_urls
      if: github.event_name == 'pull_request'
      run: |
        BASE="https://storage.googleapis.com/packages.viam.com/apps/viam-agent/prerelease/pr-${{ github.event.pull_request.number }}"
        {
          echo "urls<<EOF"
          for f in bin/viam-agent-*; do
            name=$(basename "$f")
            echo "- [\`${name}\`](${BASE}/${name})"
          done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

  msi:
    name: Build MSI
    runs-on: windows-2022
    needs: build
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      pr_url: ${{ steps.pr_url.outputs.url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: viam-agent-windows
        path: msi
    - name: Build MSI
      shell: bash
      run: |
        mv msi/viam-agent-${{ needs.build.outputs.version }}-windows-x86_64 msi/viam-agent-from-installer.exe
        dotnet tool restore
        dotnet build msi -c Release
        mv msi/bin/x64/Release/en-US/Package.msi "viam-agent-${{ needs.build.outputs.version }}-windows-x86_64.msi"
    - name: Sign MSI
      uses: ./.github/actions/sign-windows
      with:
        files: 'viam-agent-*-windows-x86_64.msi'
    - uses: actions/upload-artifact@v4
      with:
        name: viam-agent-msi
        path: viam-agent-*-windows-x86_64.msi
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
    - uses: google-github-actions/setup-gcloud@v2
    - name: Upload MSI to GCS (Release)
      if: github.event_name == 'release'
      shell: bash
      run: |
        cp viam-agent-*-windows-x86_64.msi viam-agent-stable-windows-x86_64.msi
        gsutil -h "Cache-Control:no-cache" cp viam-agent-*-windows-x86_64.msi gs://packages.viam.com/apps/viam-agent/
    # Same tagged-commit guard as the binary prerelease upload above.
    - name: Upload MSI to GCS (Prerelease)
      if: github.event_name != 'release' && github.event_name != 'pull_request' && contains(needs.build.outputs.version, '-dev.')
      shell: bash
      run: gsutil -h "Cache-Control:no-cache" cp viam-agent-*-windows-x86_64.msi gs://packages.viam.com/apps/viam-agent/prerelease/
    - name: Upload MSI to GCS (PR dev release)
      if: github.event_name == 'pull_request'
      shell: bash
      run: gsutil -h "Cache-Control:no-cache" cp viam-agent-*-windows-x86_64.msi "gs://packages.viam.com/apps/viam-agent/prerelease/pr-${{ github.event.pull_request.number }}/"
    - name: Collect MSI PR dev release URL
      id: pr_url
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        BASE="https://storage.googleapis.com/packages.viam.com/apps/viam-agent/prerelease/pr-${{ github.event.pull_request.number }}"
        for f in viam-agent-*-windows-x86_64.msi; do
          echo "url=- [\`$f\`](${BASE}/$f)" >> "$GITHUB_OUTPUT"
        done

  pr-dev-release-comment:
    name: Post PR dev release URLs
    runs-on: ubuntu-latest
    needs: [build, msi]
    # Fork PRs receive a read-only GITHUB_TOKEN regardless of declared permissions,
    # so skip this job for forks (the build job is also skipped for forks, so
    # there are no artifacts to comment about anyway). Also skip when the build
    # job was skipped entirely (e.g. no dev-release label), as there is nothing
    # to comment about.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.build.result != 'skipped'
    permissions:
      pull-requests: write
    steps:
    - name: Post or update sticky PR comment
      # marocchino/sticky-pull-request-comment@v3.0.4
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0
      with:
        header: dev-release-urls
        message: |
          ## Dev release artifacts

          Built from `${{ github.event.pull_request.head.sha }}`.

          ${{ needs.build.result == 'success' && needs.build.outputs.pr_urls || '- Binary build failed — check workflow logs' }}
          ${{ needs.msi.result == 'success' && needs.msi.outputs.pr_url || '- MSI build failed — check workflow logs' }}

          Remove the `dev-release` label to stop further dev release builds.
